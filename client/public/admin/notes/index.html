<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Notes</title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <h1>Notes Admin</h1>
        <div>
          <a class="chip" href="/admin/blog/index.html">Blog Admin</a>
          <a class="chip" href="/notes/index.html">View Public Notes</a>
        </div>
      </div>
      <section class="card">
        <form id="form" class="form">
          <label class="key-field">
            <span>Admin key</span>
            <input id="adminKey" type="password" placeholder="Enter secret key" autocomplete="current-password" required />
          </label>
          <input name="title" placeholder="Note title" required />
          <input type="date" name="noteDate" required />
          <textarea name="text" rows="5" placeholder="Write note content" required></textarea>
          <button type="submit">Save</button>
          <p id="status"></p>
        </form>
        <div id="list" class="list"></div>
      </section>
    </div>
    <script type="module" src="/admin/admin-gate.js"></script>
    <script type="module" src="/admin/notes/main.js"></script>
  </body>
  </html>
