<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A product of emergent.sh" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
    <title>Manan Portfolio</title>
    <script>
      window.MANAN_API_BASE = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"? "http://localhost:5000/api": "https://manan-portfolio-en6k.onrender.com/api";
      window.MANAN_WEB3FORMS_ACCESS_KEY = "%VITE_WEB3FORMS_ACCESS_KEY%";
    </script>
    <script>
      const adminRedirects = {
        "/admin/blog/": "/admin/blog/index.html",
        "/admin/blog": "/admin/blog/index.html",
        "/admin/notes/": "/admin/notes/index.html",
        "/admin/notes": "/admin/notes/index.html",
      };
      if (adminRedirects[window.location.pathname]) {
        window.location.replace(adminRedirects[window.location.pathname]);
      }

      window.addEventListener(
        "error",
        function (e) {
          if (
            e.error instanceof DOMException &&
            e.error.name === "DataCloneError" &&
            e.message &&
            e.message.includes("PerformanceServerTiming")
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true
      );
    </script>
    <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
    <script defer src="/static/js/bundle.js"></script>
    <link rel="stylesheet" href="/custom-enhancements.css" />
    <script defer src="/custom-enhancements.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
